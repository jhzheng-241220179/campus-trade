spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campustrade_test?connectionTimeZone=Asia/Shanghai
    username: campustrade_test_app
    password: ${CT_TEST_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    url: jdbc:mysql://localhost:3306/campustrade_test?connectionTimeZone=Asia/Shanghai
    user: campustrade_test_migrator
    password: ${CT_TEST_FLYWAY_PASSWORD}
    baseline-version: 1
    baseline-on-migrate: false
    locations: classpath:db/migration
    clean-disabled: true
  mail:
    host: localhost
    port: 2525
    username: test
    password: test

app:
  mail:
    from: test@example.com
  verification:
    hmac-secret: ${CT_TEST_HMAC_SECRET}