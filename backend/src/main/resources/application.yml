spring:
  flyway:
    enabled: false
    baseline-version: 1
    baseline-on-migrate: false
    locations: classpath:db/migration
  datasource:
    url: jdbc:mysql://localhost:3306/campustrade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: campustrade_app
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  verification:
    hmac-secret: ${VERIFICATION_HMAC_SECRET}